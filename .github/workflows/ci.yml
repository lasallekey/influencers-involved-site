name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and API tests
        run: npm test
      - name: Build and verify the committed site/ is current
        run: |
          npm run build
          npm run check
          git diff --exit-code -- site || { echo "::error::site/ is out of date. Run 'npm run build' and commit."; exit 1; }
      - name: Validate staging Worker configuration (no credentials needed)
        run: npx wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/wr" --config worker/wrangler.toml
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Browser end-to-end (starts its own preview server; synthetic data)
        run: |
          npx playwright install --with-deps chromium
          node scripts/e2e.mjs
