name: Deploy staging
# Manual only. Deploys a fresh, separate staging Worker + D1 database on Cloudflare's free tier and runs a smoke test.
# One-time setup (repository Settings → Secrets and variables → Actions) is described in docs/STAGING.md.
on:
  workflow_dispatch:
concurrency:
  group: staging
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMAIL_API_KEY: ${{ secrets.STAGING_EMAIL_API_KEY }}
      EMAIL_FROM_OVERRIDE: ${{ vars.STAGING_EMAIL_FROM }}
      WRANGLER_SEND_METRICS: "false"
      CI: "1"
    steps:
      - name: Check configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID. See docs/STAGING.md, step 2."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build staging site (banner + noindex)
        run: STAGING=1 npm run build
      - name: Create the staging database if needed
        run: node scripts/staging-provision.mjs
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply ii-pioneer-registry-staging --remote --env staging --config worker/wrangler.toml
      - name: Deploy Worker and site
        id: deploy
        run: |
          ARGS=()
          if [ -n "$EMAIL_FROM_OVERRIDE" ]; then ARGS+=(--var "EMAIL_FROM:$EMAIL_FROM_OVERRIDE"); fi
          npx wrangler deploy --env staging --config worker/wrangler.toml "${ARGS[@]}" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Could not find the deployed URL. If the log mentions a workers.dev subdomain, open Cloudflare → Workers & Pages once to choose it (docs/STAGING.md)."; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Set Worker secrets
        run: |
          NAMES=$(npx wrangler secret list --env staging --config worker/wrangler.toml --format json || echo "[]")
          if ! echo "$NAMES" | grep -q '"TOKEN_SECRET"'; then
            openssl rand -hex 32 | npx wrangler secret put TOKEN_SECRET --env staging --config worker/wrangler.toml
          fi
          if [ -n "$EMAIL_API_KEY" ]; then
            printf '%s' "$EMAIL_API_KEY" | npx wrangler secret put EMAIL_API_KEY --env staging --config worker/wrangler.toml
          fi
      - name: Smoke test
        run: node scripts/smoke-staging.mjs "${{ steps.deploy.outputs.url }}"
      - name: Summary
        run: |
          {
            echo "### Staging is live"
            echo ""
            echo "${{ steps.deploy.outputs.url }}"
            echo ""
            if [ -n "$EMAIL_API_KEY" ]; then echo "Email: configured (sending as \`${EMAIL_FROM_OVERRIDE:-onboarding@resend.dev}\`)."; else echo "Email: not configured yet. Pledges and certificates work; verification emails are skipped until STAGING_EMAIL_API_KEY is added and this workflow is run again."; fi
          } >> "$GITHUB_STEP_SUMMARY"
