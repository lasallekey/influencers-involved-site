# Staging/production configuration for the Pioneer Registry Worker.
# No secrets live here. Set secrets with `wrangler secret put` (see docs/OPERATIONS.md).
name = "ii-pioneer-registry"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One Worker serves the static site and the /api/* routes, so the site and API share an origin
# (no CORS, no cross-site cookies). A workers.dev URL works for staging with no DNS changes.
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "ii-pioneer-registry"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[vars]
# Public base URL of the site (used for verification redirects). Staging: your workers.dev URL.
SITE_URL = "https://influencersinvolved.org"
# Extra browser origins allowed to call the API (comma-separated). Empty = same-origin only.
ALLOWED_ORIGINS = ""
EMAIL_FROM = "Influencers Involved <grants@influencersinvolved.org>"
EMAIL_API_URL = "https://api.resend.com/emails"
# Secrets (not in this file): TOKEN_SECRET, EMAIL_API_KEY

# ─────────────────────────────────────────────────────────────────────────────
# Staging: separate Worker + separate (fresh) D1 database, free-tier friendly.
# The GitHub Actions workflow ".github/workflows/staging.yml" creates the database, writes its id in
# place of the placeholder below, applies migrations, deploys, and sets secrets. SITE_URL is blank on
# purpose: the Worker then builds verification/unsubscribe links from the URL it is served on.
# ─────────────────────────────────────────────────────────────────────────────
[env.staging]
name = "ii-pioneer-registry-staging"
workers_dev = true

[env.staging.assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ii-pioneer-registry-staging"
database_id = "REPLACE_STAGING_D1_ID"
migrations_dir = "migrations"

[env.staging.vars]
SITE_URL = ""
ALLOWED_ORIGINS = ""
# Resend's shared test sender works before any domain is verified, but only delivers to the account owner's own email.
EMAIL_FROM = "Influencers Involved <onboarding@resend.dev>"
EMAIL_API_URL = "https://api.resend.com/emails"
